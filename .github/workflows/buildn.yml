name: Build Voxy Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 1.20.x Fabric 项目一般使用 Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 编译
      - name: Build Mod
        run: chmod +x ./gradlew && ./gradlew build

      # 上传jar
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: voxy-build
          path: build/libs/*.jar
