name: Build Minecraft Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装 Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 给予 gradlew 权限
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 构建 Mod
      - name: Build Mod Jar
        run: ./gradlew build

      # 上传 jar 文件
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod
          path: build/libs/*.jar
